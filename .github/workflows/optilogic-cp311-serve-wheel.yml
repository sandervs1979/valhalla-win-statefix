name: Build Optilogic CPython 3.11 serve wheel

on:
  workflow_dispatch:
  push:
    branches:
      - 3.9.0-optilogic-serve

permissions:
  contents: read

jobs:
  build:
    name: manylinux x86_64 CPython 3.11
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure a CPython 3.11-specific wheel build
        shell: bash
        run: |
          # Upstream 3.9.0 deliberately publishes a cp312 stable-ABI wheel.
          # Optilogic currently runs CPython 3.11, so emit a conventional
          # cp311-cp311 wheel without changing Valhalla source code.
          sed -i '/^wheel\.py-api = "cp312"$/d' pyproject.toml

      - uses: pypa/cibuildwheel@v2.23.3
        env:
          CIBW_BUILD: cp311-manylinux_x86_64
          CIBW_ARCHS_LINUX: x86_64
          CIBW_ENVIRONMENT: >-
            CMAKE_ARGS="-DVALHALLA_VERSION_MODIFIER=optilogic-cp311"
            LD_LIBRARY_PATH="/usr/local/lib:/usr/local/lib64"
            CIBW_BUILD_VERBOSITY=3
            SKBUILD_LOGGING_LEVEL=DEBUG

      - name: Verify the wheel in CPython 3.11
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check wheelhouse/*cp311*.whl
          python -c "from valhalla import Actor; print(Actor)"

      - uses: actions/upload-artifact@v4
        with:
          name: pyvalhalla-3.9.0-cp311-manylinux_2_28-x86_64
          path: wheelhouse/*cp311*.whl
          if-no-files-found: error
          retention-days: 30
